<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip — The money text you'll actually reply to</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .lock { align-self: center; width: 100%; border-radius: 64px; padding: 60px 36px 48px; display: flex; flex-direction: column; gap: 18px;
    background: radial-gradient(120% 90% at 20% 0%, #3b3f8f 0%, #1c1b3a 45%, #0b0b16 100%); box-shadow: 0 0 0 10px #1c1c22, 0 40px 120px rgba(0,0,0,0.5); }
  .date { text-align: center; font-size: 34px; font-weight: 600; opacity: 0.85; }
  .time { text-align: center; font-size: 190px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin-bottom: 26px; }
  .note { background: rgba(245,245,250,0.78); color: #111; border-radius: 36px; padding: 24px 28px; backdrop-filter: blur(20px); }
  .nh { display: flex; align-items: center; gap: 12px; font-size: 24px; color: #555; margin-bottom: 6px; }
  .nh b { color: #111; font-size: 26px; } .nh span:last-child { margin-left: auto; }
  .ma { width: 40px; height: 40px; border-radius: 10px; background: #30d158; display: grid; place-items: center; font-size: 22px; }
  .note p { font-size: 32px; line-height: 1.3; }
  body:not(.story) .time { font-size: 130px; margin-bottom: 10px; }
  body:not(.story) .lock { padding: 40px 32px 36px; gap: 14px; }
  body:not(.story) .note p { font-size: 29px; }
  .reply { align-self: flex-end; } .reply span { display: inline-block; background: var(--imsg-blue); color: #fff; font-size: 32px; padding: 16px 26px; border-radius: 34px; }
</style>
</head>
<body class="grain">
<div class="canvas">

  <div class="glow" style="left:-300px; top:600px"></div>
  <div class="headline sm">The only money notification <em>you'll reply to.</em></div>
  <div class="lock">
    <div class="date">Tuesday, June 9</div>
    <div class="time">9:41</div>
    <div class="note">
      <div class="nh"><span class="ma">💬</span><b>Flip</b><span>now</span></div>
      <p>Heads up — Hulu renews tomorrow ($17.99). You haven't watched since March. Want me to cancel it?</p>
    </div>
    <div class="reply"><span>yes pls 🙏</span></div>
    <div class="note">
      <div class="nh"><span class="ma">💬</span><b>Flip</b><span>now</span></div>
      <p>Canceled ✅ That's $215.88/yr back in your pocket.</p>
    </div>
  </div>

  <div class="cta">
    <div class="logo"><div class="logo-mark">f</div>Flip</div>
    <div class="pill">Text Flip →</div>
  </div>
</div>
<script src="../shared/engine.js"></script>
<script></script>
</body>
</html>
